services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shebapath
      POSTGRES_PASSWORD: shebapath
      POSTGRES_DB: shebapath
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shebapath"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://shebapath:shebapath@db:5432/shebapath
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

volumes:
  pgdata:
